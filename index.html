<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Keren · 10 años</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg" aria-hidden="true"><i class="orb a"></i><i class="orb b"></i></div>
    <canvas id="fx" aria-hidden="true"></canvas>
    <canvas id="fly" aria-hidden="true"></canvas>

    <main class="stage">
        <div class="book" id="book" aria-live="polite"></div>
        <button class="nav prev" id="prev" aria-label="Página anterior">&#8249;</button>
        <button class="nav next" id="next" aria-label="Página siguiente">&#8250;</button>
    </main>

    <button class="snd" id="snd" aria-label="Sonido de las páginas" aria-pressed="true" title="Sonido">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/>
            <path class="w" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/>
            <path class="x" d="M16 9.5l5 5M21 9.5l-5 5"/>
        </svg>
    </button>

    <div class="count" id="count"></div>
    <div class="toast" id="toast" role="status"></div>

    <div class="zoom" id="zoom" aria-hidden="true">
        <button class="zclose" id="zclose" aria-label="Cerrar">&times;</button>
        <img id="zimg" alt="" draggable="false">
    </div>

    <script src="script.js"></script>
    <script src="butterfly.js"></script>
</body>
</html>
